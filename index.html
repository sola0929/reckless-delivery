<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>貨運快遞</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="panel" id="stats">
        <div class="stat"><span class="label">時速</span><span class="value" id="speed">0</span><span class="unit">km/h</span></div>
        <div class="stat"><span class="label">貨物價值</span><span class="value" id="value">$0</span><span class="unit" id="value-full">/ $0</span><div id="value-bar"><div id="value-fill"></div><div id="value-goal"></div></div></div>
        <div class="stat"><span class="label">車上貨物</span><span class="value" id="cargo">0 / 0</span></div>
        <div class="stat" id="timer-stat"><span class="label">時間</span><span class="value" id="timer">0:00</span></div>
      </div>
      <div class="panel" id="nav" hidden>
        <div id="nav-arrow"></div>
        <div><span class="label">卸貨區</span><span class="value" id="nav-distance">0</span><span class="unit">m</span></div>
      </div>
      <div id="banner" hidden>
        <div id="banner-title"></div>
        <div id="banner-brief"></div>
      </div>
      <canvas id="minimap"></canvas>
      <div id="popups"></div>
      <div class="panel" id="result" hidden>
        <div id="result-title"></div>
        <div id="result-stars"></div>
        <div id="result-value"></div>
        <div id="result-detail"></div>
        <div id="result-hint">按 <b>R</b> 再玩一次</div>
      </div>
      <div id="prompt" hidden></div>
      <div class="panel" id="help"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
