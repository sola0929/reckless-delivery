<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>貨運物理沙盒</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="panel" id="stats">
        <div class="stat"><span class="label">時速</span><span class="value" id="speed">0</span><span class="unit">km/h</span></div>
        <div class="stat"><span class="label">貨物價值</span><span class="value" id="value">$0</span><span class="unit" id="value-full">/ $0</span><div id="value-bar"><div id="value-fill"></div></div></div>
        <div class="stat"><span class="label">車上貨物</span><span class="value" id="cargo">0 / 0</span></div>
      </div>
      <div id="popups"></div>
      <div class="panel" id="help">
        <b>W</b> 前進　<b>Shift</b> 急加速　<b>S</b> 煞車（按住越久越重）、倒車　<b>A / D</b> 轉向　<b>空白鍵</b> 手煞車　<b>R</b> 重置　<b>滾輪</b> 縮放
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
